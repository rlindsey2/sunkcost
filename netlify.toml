# Static site: everything is built ahead of time, there is no backend.
[build]
  publish = "dist"
  command = "npm run build && npx tsx scripts/set-site-url.ts"

[build.environment]
  NODE_VERSION = "22"

# Share tags for a linked configuration are rewritten at the edge; see netlify/edge-functions/og.ts
[[edge_functions]]
  path = "/"
  function = "og"

# The preview address predates the domain. Send it, path and query intact, to the real one.
# Only this exact host matches, so deploy previews (deploy-preview-N--…) keep working.
[[redirects]]
  from = "https://sunkcost-preview.netlify.app/*"
  to = "https://sunkcost.ai/:splat"
  status = 301
  force = true

# The generated pages are real files under /leaderboard, /models, /hardware and /compare.
# Anything else falls back to the app, whose configuration lives in the query string.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
